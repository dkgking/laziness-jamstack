# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.213.5/schema/sveltia-cms.json
backend:
  name: github
  repo: OWNER/REPO # TODO: set your GitHub repository (owner/repo)
  branch: main
  # Sign in with a GitHub personal access token ("Sign in with token"). For an
  # OAuth button, deploy an external proxy (sveltia-cms-auth) and set its
  # address as base_url here: see .claude/skills/sveltia-cms/SKILL.md.
  commit_messages:
    openAuthoring: '{{message}} (by {{author-login}})'

app_title: Site Admin
publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads
logo:
  src: /app-icon.svg
  show_in_header: true

slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"
  trim: true
  lowercase: true
  timezone: utc

collections:
  # Each page's words, one file per page: content/pages/<page>.yaml. A new
  # page adds an entry here, its schema in src/content/pages.ts, and its file.
  - name: "pages"
    label: "Pages"
    icon: "web"
    description: "The words of each page: content/pages/<page>.yaml"
    editor:
      preview: false
    files:
      - name: "home"
        label: "Home"
        file: "content/pages/home.yaml"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text", required: false }
          - label: "Latest posts"
            name: "latest"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Link label", name: "link", widget: "string" }
          - label: "Authors"
            name: "authors"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
          - { label: "Search title", name: "seo_title", widget: "string", required: false, hint: "Shown by search engines and link previews in place of the title" }
          - { label: "Search description", name: "seo_description", widget: "text", required: false, hint: "One or two sentences for search results and link previews" }
      - name: "posts"
        label: "Posts"
        file: "content/pages/posts.yaml"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text", required: false }
          - { label: "Search title", name: "seo_title", widget: "string", required: false, hint: "Shown by search engines and link previews in place of the title" }
          - { label: "Search description", name: "seo_description", widget: "text", required: false, hint: "One or two sentences for search results and link previews" }

  - name: "settings"
    label: "Settings"
    icon: "settings"
    description: "What every page shares: content/settings/site.yaml"
    editor:
      preview: false
    files:
      - name: "site"
        label: "Site"
        file: "content/settings/site.yaml"
        fields:
          - { label: "Site name", name: "name", widget: "string" }
          - { label: "Description", name: "description", widget: "text", required: false, hint: "What the site is, for search results and link previews" }
          - { label: "Share picture", name: "image", widget: "image", required: false, hint: "Shown by a link to a page that has no picture of its own" }
          - { label: "X handle", name: "twitter", widget: "string", required: false, hint: "With its @, e.g. @example" }
          - { label: "Google verification", name: "google_verification", widget: "string", required: false, hint: "The code from Google Search Console" }
          - { label: "Theme color", name: "theme_color", widget: "string", required: false, hint: "A color such as #0f172a, used by browsers around the page" }
          - label: "Organization"
            name: "organization"
            widget: "object"
            hint: "Who publishes the site, for search engines"
            fields:
              - { label: "Name", name: "name", widget: "string", required: false }
              - { label: "Website", name: "url", widget: "string", type: "url", required: false }
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Email", name: "email", widget: "string", type: "email", required: false }
          - label: "Navigation"
            name: "nav"
            widget: "list"
            summary: "{{label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Path", name: "to", widget: "string", hint: "A path on this site, e.g. /posts" }
          - { label: "Footer note", name: "footer_note", widget: "string", required: false, hint: "A line under the footer links, e.g. the copyright" }
          - label: "Footer links"
            name: "footer_links"
            widget: "list"
            summary: "{{label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Path", name: "to", widget: "string", hint: "A page of this site by its route, e.g. /page/privacy (the site shows its public address)" }

  - name: "authors"
    label: "Authors"
    icon: "person"
    label_singular: "Author"
    description: "Authors collections"
    folder: "content/authors"
    slug: "{{slug}}"
    create: true
    extension: yaml
    format: yaml
    editor:
      preview: false
    fields:
      - { label: "Name", name: "name", widget: "string"}
      - { label: "Avatar", name: "avatar", widget: "image", required: false }
      - { label: "Bio", name: "bio", widget: "text", required: false }
      - { label: "Email", name: "email", widget: "string", type: "email", required: false }
      - { label: "Website", name: "website", widget: "string", type: "url", required: false, hint: "Full URL, e.g. https://example.com" }
      - { label: "Twitter", name: "twitter", widget: "string", type: "url", required: false, hint: "Full URL, e.g. https://x.com/handle" }
      - { label: "GitHub", name: "github", widget: "string", type: "url", required: false, hint: "Full URL, e.g. https://github.com/handle" }

  - name: "posts"
    label: "Posts"
    icon: "article"
    label_singular: "Post"
    description: "Blog posts: content/posts/<slug>.md"
    folder: "content/posts"
    slug: "{{slug}}"
    create: true
    extension: md
    format: frontmatter
    sortable_fields: [date, title]
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      # Saved in UTC with a trailing Z so builds do not depend on the machine timezone.
      - { label: "Date", name: "date", widget: "datetime", output_utc: true }
      - label: "Author"
        name: "author"
        widget: "relation"
        collection: "authors"
        value_field: "{{slug}}"
        search_fields: ["name"]
        display_fields: ["name"]
      - { label: "Cover", name: "cover", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Listed first on the home page" }
      - { label: "Search title", name: "seo_title", widget: "string", required: false, hint: "Shown by search engines and link previews in place of the title" }
      - { label: "Search description", name: "seo_description", widget: "text", required: false, hint: "In place of the summary, for search results and link previews" }
      - { label: "Share picture", name: "og_image", widget: "image", required: false, hint: "In place of the cover, for link previews" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "text-pages"
    label: "Text pages"
    icon: "description"
    label_singular: "Text page"
    description: "A title and a text (privacy, terms): content/text-pages/<slug>.md, shown at /page/<slug>"
    folder: "content/text-pages"
    slug: "{{slug}}"
    create: true
    extension: md
    format: frontmatter
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Updated", name: "updated", widget: "datetime", output_utc: true }
      - { label: "Search title", name: "seo_title", widget: "string", required: false, hint: "Shown by search engines and link previews in place of the title" }
      - { label: "Search description", name: "seo_description", widget: "text", required: false, hint: "In place of the summary, for search results and link previews" }
      - { label: "Body", name: "body", widget: "markdown" }
